# DNF5 policy, applied before every stage's first DNF transaction.
# Freeze selected upstream major versions; allow minor/patch and RPM release fixes.
# Keep epochs explicit: they take precedence over versions in RPM comparisons.
# Fedora 44 baselines: https://src.fedoraproject.org/rpms/<name>/blob/f44/f/<name>.spec
# Format: https://dnf5.readthedocs.io/en/latest/commands/versionlock.8.html
version = "1.0"

[[packages]]
name = "git"
comment = "Keep git on 2.x; allow Fedora release updates"
[[packages.conditions]]
key = "evr"
comparator = ">="
value = "0:2"
[[packages.conditions]]
key = "evr"
comparator = "<"
value = "0:3"

